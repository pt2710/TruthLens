<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #475569; }
.card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; }
.accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 20; }
.warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 20; }
.label { font-size: 15px; font-weight: 600; fill: #475569; }
.value { font-size: 32px; font-weight: 700; }
.value-compact { font-size: 22px; font-weight: 700; }
.small { font-size: 13px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1.2; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 14px; fill: #334155; }
.stub { font-size: 20px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1120" height="480" fill="#f8fafc" />
<rect x="20" y="20" width="1080" height="440" fill="#ffffff" rx="26" />
<text class="title" x="52" y="68">Drift summary</text>
<text class="subtitle" x="52" y="98">Signed shifts from the committed drift report. Small current samples limit interpretability.</text>
<line class="axis" x1="590.0" y1="150" x2="590.0" y2="360" />
<text class="label" x="52" y="192">Title length shift</text>
<rect x="590.0" y="174.0" width="0.0" height="28" fill="#2563eb" rx="8" />
<text class="small" x="600.0" y="192">0.000</text>
<text class="label" x="52" y="250">Sensational count shift</text>
<rect x="590.0" y="232.0" width="0.0" height="28" fill="#2563eb" rx="8" />
<text class="small" x="600.0" y="250">0.000</text>
<text class="label" x="52" y="308">Label rate shift</text>
<rect x="590.0" y="290.0" width="0.0" height="28" fill="#2563eb" rx="8" />
<text class="small" x="600.0" y="308">0.000</text>
<text class="small" x="52" y="414">Reference rows: 110 | Current rows: 44</text>
</svg>