<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #475569; }
.card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; }
.accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 20; }
.warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 20; }
.label { font-size: 15px; font-weight: 600; fill: #475569; }
.value { font-size: 32px; font-weight: 700; }
.value-compact { font-size: 22px; font-weight: 700; }
.small { font-size: 13px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1.2; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 14px; fill: #334155; }
.stub { font-size: 20px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1240" height="640" fill="#f8fafc" />
<rect x="20" y="20" width="1200" height="600" fill="#ffffff" rx="26" />
<text class="title" x="52" y="68">Drift summary</text>
<text class="subtitle" x="52" y="98">Top signed shifts by magnitude from the committed drift report, with governance interpretation and sample context.</text>
<rect class="accent" x="52" y="132" width="274" height="152" rx="20" />
<text class="label" x="74" y="164">Retraining recommended</text>
<text class="value" x="74" y="214">no</text>
<text class="small" x="74" y="254">This is the drift gate</text>
<text class="small" x="74" y="272">verdict from the committed</text>
<text class="small" x="74" y="290">report.</text>
<rect class="card" x="350" y="132" width="274" height="152" rx="20" />
<text class="label" x="372" y="164">Trigger reasons</text>
<text class="value" x="372" y="214">none</text>
<text class="small" x="372" y="254">No trigger means the current</text>
<text class="small" x="372" y="272">report did not cross a</text>
<text class="small" x="372" y="290">retraining threshold.</text>
<rect class="card" x="648" y="132" width="274" height="152" rx="20" />
<text class="label" x="670" y="164">Largest absolute shift</text>
<text class="value-compact" x="670" y="214">Label mix: ai</text>
<text class="value-compact" x="670" y="240">mass spam: -0.047</text>
<text class="small" x="670" y="270">Magnitude is shown relative</text>
<text class="small" x="670" y="288">to the reference sample, not</text>
<text class="small" x="670" y="306">as a production guarantee.</text>
<rect class="card" x="946" y="132" width="242" height="152" rx="20" />
<text class="label" x="968" y="164">Compared rows</text>
<text class="value" x="968" y="214">190 -&gt; 76</text>
<text class="small" x="968" y="254">Reference rows on the</text>
<text class="small" x="968" y="272">left, current rows on the</text>
<text class="small" x="968" y="290">right.</text>
<line class="axis" x1="705.0" y1="320" x2="705.0" y2="540" />
<line class="grid" x1="240" y1="320.0" x2="1170" y2="320.0" />
<line class="grid" x1="240" y1="375.0" x2="1170" y2="375.0" />
<line class="grid" x1="240" y1="430.0" x2="1170" y2="430.0" />
<line class="grid" x1="240" y1="485.0" x2="1170" y2="485.0" />
<line class="grid" x1="240" y1="540.0" x2="1170" y2="540.0" />
<text class="label" x="52" y="356">Label mix: ai mass spam</text>
<rect x="280.0" y="338.0" width="425.0" height="28" fill="#c2410c" rx="8" />
<text class="small" x="623.0" y="356">-0.047</text>
<text class="label" x="52" y="396">Label mix: fearbait</text>
<rect x="705.0" y="378.0" width="377.5" height="28" fill="#2563eb" rx="8" />
<text class="small" x="715.0" y="396">+0.042</text>
<text class="label" x="52" y="436">Channel risk mean</text>
<rect x="493.4" y="418.0" width="211.6" height="28" fill="#c2410c" rx="8" />
<text class="small" x="623.0" y="436">-0.024</text>
<text class="label" x="52" y="476">Transcript mismatch</text>
<rect x="705.0" y="458.0" width="9.0" height="28" fill="#2563eb" rx="8" />
<text class="small" x="715.0" y="476">+0.001</text>
<text class="label" x="52" y="516">Thumbnail text density</text>
<rect x="705.0" y="498.0" width="0.0" height="28" fill="#2563eb" rx="8" />
<text class="small" x="715.0" y="516">+0.000</text>
<text class="small" x="52" y="584">Positive means the current sample is higher than the reference sample on that feature. Negative means lower.</text>
<text class="small" x="52" y="606">Near-zero values mean the committed report saw little measured shift on that metric at the current sample size. They do not prove universal no-drift.</text>
</svg>