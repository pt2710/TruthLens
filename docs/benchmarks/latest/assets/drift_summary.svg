<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 12px; fill: #475569; }
.card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
.accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 14; }
.warn { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 14; }
.label { font-size: 13px; fill: #475569; }
.value { font-size: 28px; font-weight: 700; }
.small { font-size: 11px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 12px; fill: #334155; }
.stub { font-size: 16px; font-weight: 600; }
</style>
<rect x="0" y="0" width="960" height="430" fill="#ffffff" />
<text class="title" x="40" y="48">Drift summary</text>
<text class="subtitle" x="40" y="72">Signed shifts from the committed drift report. Small current samples limit interpretability.</text>
<line class="axis" x1="500.0" y1="120" x2="500.0" y2="320" />
<text class="label" x="40" y="162">Title length shift</text>
<rect x="500.0" y="144.0" width="340.0" height="28" fill="#2563eb" rx="8" />
<text class="small" x="510.0" y="162">1.000</text>
<text class="label" x="40" y="220">Sensational count shift</text>
<rect x="330.0" y="202.0" width="170.0" height="28" fill="#c2410c" rx="8" />
<text class="small" x="510.0" y="220">-0.500</text>
<text class="label" x="40" y="278">Label rate shift</text>
<rect x="330.0" y="260.0" width="170.0" height="28" fill="#c2410c" rx="8" />
<text class="small" x="510.0" y="278">-0.500</text>
<text class="small" x="40" y="372">Reference rows: 12 | Current rows: 4</text>
</svg>