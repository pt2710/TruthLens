<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 12px; fill: #475569; }
.card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
.accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 14; }
.warn { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 14; }
.label { font-size: 13px; fill: #475569; }
.value { font-size: 28px; font-weight: 700; }
.small { font-size: 11px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 12px; fill: #334155; }
.stub { font-size: 16px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff" />
<text class="title" x="40" y="48">TruthLens benchmark overview</text>
<text class="subtitle" x="40" y="72">Current committed evaluation and validation snapshot. Training metrics are not published in the current root artifacts.</text>
<rect class="card" x="40" y="112" width="290" height="150" rx="14" />
<text class="label" x="58" y="138">Eval F1</text>
<text class="value" x="58" y="182">1.000</text>
<text class="small" x="58" y="210">Committed eval snapshot</text>
<rect class="card" x="355" y="112" width="290" height="150" rx="14" />
<text class="label" x="373" y="138">Validation F1</text>
<text class="value" x="373" y="182">0.000</text>
<text class="small" x="373" y="210">Cross-check against validation split</text>
<rect class="warn" x="670" y="112" width="290" height="150" rx="14" />
<text class="label" x="688" y="138">Eval sample count</text>
<text class="value" x="688" y="182">4</text>
<text class="small" x="688" y="210">Very small n must be treated as unstable</text>
<rect class="card" x="40" y="282" width="290" height="150" rx="14" />
<text class="label" x="58" y="308">Eval precision</text>
<text class="value" x="58" y="352">1.000</text>
<rect class="card" x="355" y="282" width="290" height="150" rx="14" />
<text class="label" x="373" y="308">Eval recall</text>
<text class="value" x="373" y="352">1.000</text>
<rect class="card" x="670" y="282" width="290" height="150" rx="14" />
<text class="label" x="688" y="308">Validation calibration</text>
<text class="value" x="688" y="352">0.000</text>
</svg>