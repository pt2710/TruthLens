<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="562" viewBox="0 0 1240 562" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #475569; }
.card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; }
.accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 20; }
.warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 20; }
.label { font-size: 15px; font-weight: 600; fill: #475569; }
.value { font-size: 32px; font-weight: 700; }
.value-compact { font-size: 22px; font-weight: 700; }
.small { font-size: 13px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1.2; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 14px; fill: #334155; }
.stub { font-size: 20px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1240" height="562" fill="#f8fafc" />
<rect x="20" y="20" width="1200" height="522" fill="#ffffff" rx="26" />
<text class="title" x="52" y="68">Policy mode and runtime eligibility</text>
<text class="subtitle" x="52" y="98">This panel is derived from committed runtime config and artifact presence, not from aspirational docs.</text>
<rect class="accent" x="52" y="132" width="360" height="182" rx="20" />
<text class="label" x="74" y="164">Configured runtime mode</text>
<text class="value" x="74" y="214">bseo-shadow</text>
<text class="small" x="74" y="254">Directly from</text>
<text class="small" x="74" y="272">configs/thresholds/runtime-policy.json</text>
<rect class="card" x="436" y="132" width="360" height="182" rx="20" />
<text class="label" x="458" y="164">Resolved runtime mode</text>
<text class="value" x="458" y="214">bseo-shadow</text>
<text class="small" x="458" y="254">Aliases normalized for architectural</text>
<text class="small" x="458" y="272">truth</text>
<rect class="accent" x="820" y="132" width="360" height="182" rx="20" />
<text class="label" x="842" y="164">Committed BSEO artifact</text>
<text class="value" x="842" y="214">yes</text>
<text class="small" x="842" y="254">If absent, shadow/live is</text>
<text class="small" x="842" y="272">code-supported but not promoted as a</text>
<text class="small" x="842" y="290">committed runtime artifact.</text>
<rect class="card" x="52" y="338" width="360" height="176" rx="20" />
<text class="label" x="74" y="370">Selective verification</text>
<text class="value" x="74" y="420">explicit</text>
<text class="small" x="74" y="460">Selective deep verification exists as a</text>
<text class="small" x="74" y="478">separate contract layer rather than a</text>
<text class="small" x="74" y="496">mandatory hot path.</text>
<rect class="card" x="436" y="338" width="360" height="176" rx="20" />
<text class="label" x="458" y="370">Heavy LLM in hot path</text>
<text class="value" x="458" y="420">no</text>
<text class="small" x="458" y="460">Gemini/manual-report flows stay</text>
<text class="small" x="458" y="478">downstream of baseline scoring.</text>
<rect class="accent" x="820" y="338" width="360" height="176" rx="20" />
<text class="label" x="842" y="370">Governance recommendation</text>
<text class="value" x="842" y="420">bseo-shadow</text>
<text class="small" x="842" y="460">Max promotable mode = bseo-live</text>
</svg>