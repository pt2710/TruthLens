<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="582" viewBox="0 0 1240 582" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #475569; }
.card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; }
.accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 20; }
.warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 20; }
.label { font-size: 15px; font-weight: 600; fill: #475569; }
.value { font-size: 32px; font-weight: 700; }
.value-compact { font-size: 22px; font-weight: 700; }
.small { font-size: 13px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1.2; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 14px; fill: #334155; }
.stub { font-size: 20px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1240" height="582" fill="#f8fafc" />
<rect x="20" y="20" width="1200" height="542" fill="#ffffff" rx="26" />
<text class="title" x="52" y="68">Observation and feedback intake</text>
<text class="subtitle" x="52" y="98">Supplemental browser/feedback intake truth. These artifacts are intentionally separate from committed train, validation, and test splits.</text>
<rect class="card" x="52" y="132" width="360" height="188" rx="20" />
<text class="label" x="74" y="164">Browser observations</text>
<text class="value" x="74" y="214">1459</text>
<text class="small" x="74" y="254">unique_items=671, score_links=1459</text>
<rect class="card" x="436" y="132" width="360" height="188" rx="20" />
<text class="label" x="458" y="164">Supplemental candidates</text>
<text class="value" x="458" y="214">0</text>
<text class="small" x="458" y="254">split_blocked=0</text>
<rect class="card" x="820" y="132" width="360" height="188" rx="20" />
<text class="label" x="842" y="164">Supplemental adjudication</text>
<text class="value" x="842" y="214">0</text>
<text class="small" x="842" y="254">confirmed=0, escalations=0</text>
<rect class="card" x="52" y="346" width="360" height="188" rx="20" />
<text class="label" x="74" y="378">Feedback-linked candidates</text>
<text class="value" x="74" y="428">0</text>
<text class="small" x="74" y="468">manual_reports=0, collection_scoped=0</text>
<rect class="card" x="436" y="346" width="360" height="188" rx="20" />
<text class="label" x="458" y="378">Observation-linked candidates</text>
<text class="value" x="458" y="428">0</text>
<text class="small" x="458" y="468">review=0, hard_negative=0</text>
<rect class="warn" x="820" y="346" width="360" height="188" rx="20" />
<text class="label" x="842" y="378">Leakage guard</text>
<text class="value" x="842" y="428">blocked</text>
<text class="small" x="842" y="468">Supplemental intake remains excluded</text>
<text class="small" x="842" y="486">from direct train/validation/test</text>
<text class="small" x="842" y="504">writes until future deterministic</text>
<text class="small" x="842" y="522">ingestion.</text>
</svg>