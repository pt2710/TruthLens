<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="582" viewBox="0 0 1240 582" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #475569; }
.card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; }
.accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 20; }
.warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 20; }
.label { font-size: 15px; font-weight: 600; fill: #475569; }
.value { font-size: 32px; font-weight: 700; }
.value-compact { font-size: 22px; font-weight: 700; }
.small { font-size: 13px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1.2; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 14px; fill: #334155; }
.stub { font-size: 20px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1240" height="582" fill="#f8fafc" />
<rect x="20" y="20" width="1200" height="542" fill="#ffffff" rx="26" />
<text class="title" x="52" y="68">Observation and feedback intake</text>
<text class="subtitle" x="52" y="98">Local feedback, creator/operator curation, and global benchmark truth are rendered as separate operational layers.</text>
<rect class="card" x="52" y="132" width="360" height="188" rx="20" />
<text class="label" x="74" y="164">Browser observations</text>
<text class="value" x="74" y="214">1459</text>
<text class="small" x="74" y="254">unique_items=671, score_links=1459</text>
<rect class="card" x="436" y="132" width="360" height="188" rx="20" />
<text class="label" x="458" y="164">Local user feedback</text>
<text class="value" x="458" y="214">65</text>
<text class="small" x="458" y="254">Ordinary local-user feedback stays in</text>
<text class="small" x="458" y="272">the runtime/local optimization layer</text>
<text class="small" x="458" y="290">unless it is explicitly curated</text>
<text class="small" x="458" y="308">elsewhere.</text>
<rect class="card" x="820" y="132" width="360" height="188" rx="20" />
<text class="label" x="842" y="164">Creator/operator candidates</text>
<text class="value" x="842" y="214">53</text>
<text class="small" x="842" y="254">gold=53, ingested=53</text>
<rect class="card" x="52" y="346" width="360" height="188" rx="20" />
<text class="label" x="74" y="378">Legacy supplemental intake</text>
<text class="value" x="74" y="428">0</text>
<text class="small" x="74" y="468">split_blocked=0, adjudicated=0</text>
<rect class="card" x="436" y="346" width="360" height="188" rx="20" />
<text class="label" x="458" y="378">Creator/operator adjudication</text>
<text class="value" x="458" y="428">53</text>
<text class="small" x="458" y="468">confirmed_risk=25, confirmed_benign=28</text>
<rect class="accent" x="820" y="346" width="360" height="188" rx="20" />
<text class="label" x="842" y="378">Global benchmark truth</text>
<text class="value" x="842" y="428">395</text>
<text class="small" x="842" y="468">train=236, validation=58, test=101</text>
</svg>