<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 12px; fill: #475569; }
.card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
.accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 14; }
.warn { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 14; }
.label { font-size: 13px; fill: #475569; }
.value { font-size: 28px; font-weight: 700; }
.small { font-size: 11px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 12px; fill: #334155; }
.stub { font-size: 16px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff" />
<text class="title" x="40" y="48">Observation and feedback intake</text>
<text class="subtitle" x="40" y="72">Supplemental browser/feedback intake truth. These artifacts are intentionally separate from committed train, validation, and test splits.</text>
<rect class="card" x="40" y="112" width="280" height="150" rx="14" />
<text class="label" x="58" y="138">Browser observations</text>
<text class="value" x="58" y="182">0</text>
<text class="small" x="58" y="210">unique_items=0</text>
<rect class="card" x="350" y="112" width="280" height="150" rx="14" />
<text class="label" x="368" y="138">Supplemental candidates</text>
<text class="value" x="368" y="182">0</text>
<text class="small" x="368" y="210">split_blocked=0</text>
<rect class="card" x="660" y="112" width="300" height="150" rx="14" />
<text class="label" x="678" y="138">Supplemental adjudication</text>
<text class="value" x="678" y="182">0</text>
<text class="small" x="678" y="210">confirmed=0, escalations=0</text>
<rect class="card" x="40" y="282" width="280" height="150" rx="14" />
<text class="label" x="58" y="308">Feedback-linked candidates</text>
<text class="value" x="58" y="352">0</text>
<text class="small" x="58" y="380">manual_reports=0</text>
<rect class="card" x="350" y="282" width="280" height="150" rx="14" />
<text class="label" x="368" y="308">Observation-linked candidates</text>
<text class="value" x="368" y="352">0</text>
<text class="small" x="368" y="380">review=0, hard_negative=0</text>
<rect class="warn" x="660" y="282" width="300" height="150" rx="14" />
<text class="label" x="678" y="308">Leakage guard</text>
<text class="value" x="678" y="352">blocked</text>
<text class="small" x="678" y="380">Supplemental intake remains excluded from direct</text>
<text class="small" x="678" y="396">train/validation/test writes until future</text>
<text class="small" x="678" y="412">deterministic ingestion.</text>
</svg>