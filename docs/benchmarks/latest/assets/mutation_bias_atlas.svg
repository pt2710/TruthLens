<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="568" viewBox="0 0 1240 568" role="img">
<style>
text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.title { font-size: 34px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #475569; }
.card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 20; }
.accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 20; }
.warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 20; }
.label { font-size: 15px; font-weight: 600; fill: #475569; }
.value { font-size: 32px; font-weight: 700; }
.value-compact { font-size: 22px; font-weight: 700; }
.small { font-size: 13px; fill: #64748b; }
.axis { stroke: #94a3b8; stroke-width: 1.2; }
.grid { stroke: #e2e8f0; stroke-width: 1; }
.legend { font-size: 14px; fill: #334155; }
.stub { font-size: 20px; font-weight: 600; }
</style>
<rect x="0" y="0" width="1240" height="568" fill="#f8fafc" />
<rect x="20" y="20" width="1200" height="528" fill="#ffffff" rx="26" />
<text class="title" x="52" y="68">Mutation bias atlas</text>
<text class="subtitle" x="52" y="98">Cluster overview from committed BSEO lineage artifacts.</text>
<rect class="card" x="52" y="132" width="360" height="182" rx="20" />
<text class="label" x="74" y="164">Atlas status</text>
<text class="value" x="74" y="214">clustered</text>
<rect class="card" x="436" y="132" width="360" height="182" rx="20" />
<text class="label" x="458" y="164">Usable mutations</text>
<text class="value" x="458" y="214">106</text>
<rect class="card" x="820" y="132" width="360" height="182" rx="20" />
<text class="label" x="842" y="164">Cluster count</text>
<text class="value" x="842" y="214">1</text>
<rect class="card" x="52" y="338" width="360" height="182" rx="20" />
<text class="label" x="74" y="370">Cluster 0</text>
<text class="value" x="74" y="420">size=24</text>
<text class="small" x="74" y="460">avg dF=0.000, avg dB=0.000</text>
