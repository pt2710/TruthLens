<rect x="512.0" y="349.4" width="48.0" height="60.6" fill="#7c3aed" rx="6" />
<text class="small" x="566.0" y="434" text-anchor="middle">channel_prior_dependency</text>
<rect x="728.0" y="363.9" width="48.0" height="46.1" fill="#7c3aed" rx="6" />
