[project]
name = "truthlens"
version = "0.1.0"
description = "TruthLens backend, data, and governance monorepo bootstrap"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]>=0.34.0,<0.35.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.39,<3.0.0",
  "alembic>=1.15.2,<2.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "redis>=5.2.1,<6.0.0",
  "httpx>=0.28.1,<0.29.0",
  "orjson>=3.10.16,<4.0.0",
  "numpy>=2.2.4,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "scikit-learn>=1.6.1,<2.0.0"
]

[project.optional-dependencies]
data = [
  "pandas>=2.2.0,<3.0.0",
  "pyarrow>=19.0.0,<20.0.0",
  "duckdb>=1.2.1,<2.0.0",
  "fsspec>=2025.3.2,<2026.0.0",
  "tqdm>=4.67.1,<5.0.0",
  "imagehash>=4.3.2,<5.0.0",
  "rapidfuzz>=3.12.2,<4.0.0"
]
ml = [
  "numpy>=2.2.4,<3.0.0",
  "scipy>=1.15.2,<2.0.0",
  "scikit-learn>=1.6.1,<2.0.0",
  "transformers>=4.50.0,<5.0.0",
  "tokenizers>=0.21.1,<0.22.0",
  "sentence-transformers>=4.0.1,<5.0.0",
  "opencv-python>=4.11.0.86,<5.0.0",
  "Pillow>=11.1.0,<12.0.0",
  "xgboost>=2.1.4,<3.0.0",
  "lightgbm>=4.6.0,<5.0.0",
  "shap>=0.47.1,<0.48.0",
  "mlflow>=2.21.2,<3.0.0"
]
simulation = [
  "gymnasium>=1.1.1,<2.0.0",
  "stable-baselines3>=2.6.0,<3.0.0",
  "deap>=1.4.3,<2.0.0",
  "nevergrad>=1.0.12,<2.0.0",
  "optuna>=4.2.1,<5.0.0"
]

[dependency-groups]
dev = [
  "black>=25.1.0,<26.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.26.0,<0.27.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "ruff>=0.11.10,<0.12.0"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = [
  "apps/api/src",
  "apps/trainer/src",
  "libs/shared-schemas/python",
  "libs/feature-extractors/src",
  "libs/data-pipeline/src",
  "libs/dataset-governance/src",
  "libs/policy-engine/python",
  "libs/explanation-engine/python",
  "libs/evaluation/src",
  "libs/model-serving/python"
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = "(^tests[\\\\/])"
mypy_path = [
  "apps/api/src",
  "apps/trainer/src",
  "libs/shared-schemas/python",
  "libs/feature-extractors/src",
  "libs/data-pipeline/src",
  "libs/dataset-governance/src",
  "libs/policy-engine/python",
  "libs/explanation-engine/python",
  "libs/evaluation/src",
  "libs/model-serving/python"
]

[[tool.mypy.overrides]]
module = ["sklearn.*", "torch", "torch.*", "transformers", "transformers.*", "truthlens_paths"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "render_benchmark_visualizations",
  "run_api",
  "run_truthlens_module",
  "scripts.render_benchmark_visualizations",
  "scripts.run_api",
  "scripts.run_truthlens_module",
  "truthlens_api.manual_reports",
  "truthlens_api.youtube_reporting",
  "truthlens_model_serving.registry",
  "truthlens_model_serving.temporal",
  "truthlens_model_serving.vae",
  "truthlens_model_serving.vision",
  "truthlens_trainer.train",
]
ignore_errors = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
