name: Beta feedback
description: Share tester feedback about usefulness, friction, or false positives.
title: "[beta] "
labels:
  - beta feedback
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What video/page context were you testing?
    validations:
      required: true
  - type: dropdown
    id: content_type
    attributes:
      label: Content type
      options:
        - music / art / creative
        - tutorial / educational
        - documentary / news / factual
        - satire / comedy
        - gaming
        - other / unsure
  - type: textarea
    id: outcome
    attributes:
      label: What TruthLens did
      description: Include trigger behavior, action, and explanation quality.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Friction or confusion
      description: What slowed you down or felt wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
