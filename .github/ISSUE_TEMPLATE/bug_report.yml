name: Bug report
description: Report a concrete defect in TruthLens.
title: "[bug] "
labels:
  - needs reproduction
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke, and where?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Chromium
        - Edge
        - Brave
        - Other Chromium
        - Other (not Chromium)
    validations:
      required: true
  - type: input
    id: extension_build
    attributes:
      label: Extension build/source
      description: Example: "apps/extension/dist from main @ <commit>" or "Chrome Web Store build (if applicable)"
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - extension
        - api
        - android
        - training
        - policy
        - dataset-governance
        - docs
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include URLs, commands, env assumptions, or screenshots when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. Redact any personal data or tokens. Browser console output and screenshots can help a lot.
