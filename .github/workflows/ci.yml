name: ci

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  schedule:
    - cron: '0 2 * * *'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: python -m uv sync --group dev
      - name: Ruff
        run: python -m uv run ruff check .
      - name: Mypy
        run: python -m uv run mypy .
      - name: Pytest
        run: python -m uv run pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@10.6.5
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  nightly-eval:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/api/src:apps/trainer/src:libs/shared-schemas/python:libs/data-pipeline/src:libs/dataset-governance/src:libs/policy-engine/python:libs/explanation-engine/python:libs/evaluation/src:libs/model-serving/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: python -m uv sync --group dev
      - name: Refresh dataset build
        run: python -m uv run python -m truthlens_trainer.pipeline
      - name: Refresh models
        run: python -m uv run python -m truthlens_trainer.train
      - name: Refresh simulation and drift
        run: python -m uv run python -m truthlens_trainer.simulate
